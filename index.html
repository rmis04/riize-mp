
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Music Player</title>

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.13.0/css/all.min.css">

    <!-- Styles -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="player">

    <div class="window">

        <div class="window-body">

            <div class="flex">

                <!-- =======================
                     CLICK WHEEL
                ======================== -->

                <div class="wheel">

                    <div class="wheelcontrols top">

                        <button
                            class="fas fa-plus"
                            type="button"
                            onclick="volumeUp()"
                            aria-label="Volume Up"
                            style="padding-top: 7px;">
                        </button>

                    </div>

                    <table class="wheelcontrols middle">

                        <tr>

                            <td>

                                <button
                                    class="fas fa-backward"
                                    type="button"
                                    onclick="prevTrack()"
                                    aria-label="Previous Track">
                                </button>

                            </td>

                            <td class="innerwheel">

                                <button
                                    class="playpause-track fas fa-play"
                                    type="button"
                                    onclick="playpauseTrack()"
                                    aria-label="Play / Pause">
                                </button>

                            </td>

                            <td>

                                <button
                                    class="fas fa-forward"
                                    type="button"
                                    onclick="nextTrack()"
                                    aria-label="Next Track">
                                </button>

                            </td>

                        </tr>

                    </table>

                    <div class="wheelcontrols bottom">

                        <button
                            class="fas fa-minus"
                            type="button"
                            onclick="volumeDown()"
                            aria-label="Volume Down"
                            style="margin-top: -7px;">
                        </button>

                    </div>

                </div>

                <!-- =======================
                     PLAYER DISPLAY
                ======================== -->

                <div id="musicplayer">

                    <div class="title-area">

                        <marquee
                            class="songtitle"
                            scrollamount="4">
                        </marquee>

                    </div>

                    <div class="seeking">

                        <div class="current-time">
                            0:00
                        </div>

                        <input
                            type="range"
                            class="seek_slider"
                            min="0"
                            max="100"
                            value="0"
                            onchange="seekTo()">

                        <div class="total-duration">
                            0:00
                        </div>

                    </div>

                    <table class="controls">

                        <tr>

                            <td>
                                <button type="button">
                                    <i class="fas fa-sync"></i>
                                </button>
                            </td>

                            <td>
                                <button type="button">
                                    <i class="fas fa-music"></i>
                                </button>
                            </td>

                            <td>
                                <button type="button">
                                    <i class="fas fa-random"></i>
                                </button>
                            </td>

                        </tr>

                    </table>

                </div>

            </div>

        </div>

    </div>

</div>

<audio id="music"></audio>

<script src="script.js"></script>

</body>

</html>
